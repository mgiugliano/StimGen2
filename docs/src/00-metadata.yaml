---
title: "StimGen 2"
subtitle: "A compact, symbolic language for electrophysiological stimulus waveforms: concepts, semantics, and reference specification"
author:
  - Michele Giugliano
date: "Draft — October 2026"
abstract: |
  We describe StimGen 2, a symbolic meta-description for the synthesis of
  digital stimulus waveforms in electrophysiology. A waveform is written as a
  short text, independent of its length, sampling rate, and D/A resolution, and
  is converted into a sequence of samples only at the moment of use. We give
  the language a precise mathematical meaning. We separate three layers (waveform, multichannel stimulus, and
  protocol). We define the sampling of a continuous-time description, the
  algebra by which waveforms are combined, and the statistical semantics of
  stochastic components together with their reproducibility. Descriptions
  are stored as plain text files with the extension `.sg`.

